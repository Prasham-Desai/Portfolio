<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 200" width="600" height="200">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#04050a" />
      <stop offset="100%" stopColor="#0f1123" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stopColor="#00d4ff" />
      <stop offset="100%" stopColor="#c084fc" />
    </linearGradient>
    <pattern id="dotGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.5" fill="rgba(0,212,255,0.06)" />
    </pattern>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@700&amp;family=Space+Grotesk:wght@700&amp;display=swap');
      .status { font-family: 'JetBrains Mono', monospace; font-size: 14px; font-weight: 700; fill: #c084fc; letter-spacing: 6px; text-transform: uppercase; text-anchor: middle; dominant-baseline: central; }
      .logo { font-family: 'Space Grotesk', sans-serif; font-size: 80px; font-weight: 700; fill: #00d4ff; letter-spacing: -2px; text-anchor: middle; dominant-baseline: central; }
    </style>
  </defs>

  <rect x="1" y="1" width="598" height="198" rx="8" fill="url(#bgGrad)" stroke="rgba(0,212,255,0.15)" stroke-width="2"/>
  <rect x="1" y="1" width="598" height="198" rx="8" fill="url(#dotGrid)" />

  <circle cx="100" cy="100" r="120" fill="rgba(0,212,255,0.05)" filter="blur(40px)" />
  <circle cx="500" cy="100" r="120" fill="rgba(192,132,252,0.06)" filter="blur(50px)" />

  <path d="M 0 100 L 220 100" stroke="rgba(0,212,255,0.15)" stroke-width="2" />
  <path d="M 380 100 L 600 100" stroke="rgba(192,132,252,0.15)" stroke-width="2" />
  <rect x="0" y="196" width="600" height="4" fill="url(#accentGrad)" />
  <circle cx="220" cy="100" r="3" fill="#00d4ff" />
  <circle cx="380" cy="100" r="3" fill="#c084fc" />

  <text class="logo" x="300" y="80">PD<tspan fill="#c084fc">.</tspan></text>
  <text class="status" x="300" y="140">MESSAGE RECEIVED</text>
  
</svg>
