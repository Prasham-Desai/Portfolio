<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 500" width="1500" height="500">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#04050a" />
      <stop offset="100%" stopColor="#0f1123" />
    </linearGradient>
    <radialGradient id="glowPurple" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stopColor="rgba(192,132,252,0.15)" />
      <stop offset="100%" stopColor="rgba(192,132,252,0)" />
    </radialGradient>
    <radialGradient id="glowCyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stopColor="rgba(0,212,255,0.2)" />
      <stop offset="100%" stopColor="rgba(0,212,255,0)" />
    </radialGradient>
    <pattern id="hexGrid" width="60" height="103.923" patternUnits="userSpaceOnUse" patternTransform="scale(0.5)">
      <path d="M30 0 L60 17.32 L60 51.96 L30 69.28 L0 51.96 L0 17.32 Z" fill="none" stroke="rgba(255,255,255,0.02)" stroke-width="1"/>
      <path d="M30 103.92 L60 86.6 L60 51.96 L30 34.64 L0 51.96 L0 86.6 Z" fill="none" stroke="rgba(255,255,255,0.02)" stroke-width="1"/>
    </pattern>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700;800&amp;family=Inter:wght@400;500;600&amp;family=JetBrains+Mono:wght@700&amp;display=swap');
      .name { font-family: 'Space Grotesk', sans-serif; font-size: 80px; font-weight: 800; fill: #ffffff; letter-spacing: -1px; text-anchor: middle; dominant-baseline: central; }
      .role { font-family: 'JetBrains Mono', monospace; font-size: 22px; font-weight: 700; fill: #00d4ff; letter-spacing: 8px; text-transform: uppercase; text-anchor: middle; dominant-baseline: central; }
      .contact-icon { font-family: 'JetBrains Mono', monospace; font-size: 16px; font-weight: 700; fill: #c084fc; letter-spacing: 4px; text-anchor: middle; dominant-baseline: central; text-transform: uppercase; }
      .contact-text { font-family: 'Inter', sans-serif; font-size: 18px; font-weight: 500; fill: #cbd5e1; text-anchor: middle; dominant-baseline: central; }
    </style>
  </defs>
  
  <rect width="1500" height="500" fill="url(#bgGrad)" />
  <rect width="1500" height="500" fill="url(#hexGrid)" />
  
  <ellipse cx="750" cy="250" rx="600" ry="300" fill="url(#glowPurple)" />
  <ellipse cx="750" cy="250" rx="400" ry="200" fill="url(#glowCyan)" />
  
  <path d="M 0 250 L 300 250" stroke="rgba(255,255,255,0.05)" stroke-width="2" />
  <path d="M 1200 250 L 1500 250" stroke="rgba(255,255,255,0.05)" stroke-width="2" />
  <circle cx="300" cy="250" r="4" fill="#00d4ff" />
  <circle cx="1200" cy="250" r="4" fill="#00d4ff" />

  <!-- Strictly centered content -->
  <text class="name" x="750" y="200">Prasham Desai<tspan fill="#00d4ff">.</tspan></text>
  <text class="role" x="750" y="270">Gameplay &amp; Systems Developer</text>
  
  <!-- Divider -->
  <rect x="690" y="320" width="120" height="4" rx="2" fill="#00d4ff" />

  <!-- Contact Grid Array -->
  <g transform="translate(0, 390)">
    <!-- GitHub -->
    <text class="contact-icon" x="400" y="0">GITHUB</text>
    <text class="contact-text" x="400" y="35">github.com/Prasham-Desai</text>
    
    <!-- Email -->
    <text class="contact-icon" x="750" y="0">EMAIL</text>
    <text class="contact-text" x="750" y="35">prashamdesai9114@gmail.com</text>
    
    <!-- LinkedIn -->
    <text class="contact-icon" x="1100" y="0">LINKEDIN</text>
    <text class="contact-text" x="1100" y="35">linkedin.com/in/prasham-desai</text>
  </g>
</svg>
